services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: csn
      POSTGRES_PASSWORD: csn
      POSTGRES_DB: csn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csn -d csn"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
