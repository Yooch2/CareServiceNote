[project]
name = "careservicenote-api"
version = "0.1.0"
description = "CareServiceNote API - 방문요양 음성 기록 정리·인계 서비스"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.29.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
local = [
    "mlx-whisper>=0.4.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 실제 AI 모델을 호출하는 테스트 (수동 실행: uv run pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
