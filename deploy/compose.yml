# 운영 배포: 서버 한 대에서 DB·API·워커·화면·Caddy(HTTPS)를 함께 띄운다.
#   cp .env.example .env  → 값 채우기 →  docker compose up -d --build
# 자세한 순서는 DEPLOY.md

x-backend: &backend
  build: ../backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://csn:${POSTGRES_PASSWORD}@db:5432/csn
    ENV: production
    COOKIE_SECURE: "true"
    # API는 Caddy를 거쳐서만 닿는다 → Caddy가 넣는 X-Forwarded-For를 클라이언트 IP로 쓴다
    # (Caddy는 신뢰하지 않는 클라이언트가 보낸 X-Forwarded-For를 실제 주소로 덮어쓴다)
    TRUST_PROXY: "true"
  volumes:
    - media:/data/media # 암호화된 음성·사진
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: csn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
      POSTGRES_DB: csn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csn -d csn"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    # 포트를 밖으로 열지 않는다

  # 마이그레이션(과 데모 시드)을 한 번 돌리고 끝난다
  migrate:
    <<: *backend
    restart: "no"
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$SEED_DEMO\" = true ]; then python -m app.seed; fi"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 넣어 주세요}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 인증서
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
