name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: csn
          POSTGRES_PASSWORD: csn
          POSTGRES_DB: csn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U csn -d csn"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # 배포 이미지가 깨지지 않았는지만 확인한다 (올리지는 않음)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t csn-backend backend
      - run: docker build -t csn-frontend frontend
      - name: 운영 설정 검사가 위험한 값을 막는지
        run: |
          if docker run --rm -e ENV=production -e JWT_SECRET=short csn-backend python -c "import app.config"; then
            echo "운영 설정 검사가 통과되면 안 됩니다"; exit 1
          fi
